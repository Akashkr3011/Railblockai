# Alembic Migration Environment Configuration
# Generic, single-database configuration.

[alembic]
# Path to migration scripts
script_location = %(here)s/alembic

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone to use when rendering the date within the migration file's comment.
timezone = UTC

# Prepend sys.path with this relative path to the project root so that
# app.config can be imported by env.py
prepend_sys_path = .

# Version path separator; use the character which your OS prefers: 
version_path_separator = os

# Set to 'true' to run the environment during the 'revision' command, even when script_location is not under version control
# revision_environment = false

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
